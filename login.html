<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      overflow: hidden;
    }

    /* glowing background orbs */
    body::before, body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
    }

    body::before {
      background: #00ffcc;
      top: -100px;
      left: -100px;
      animation: float1 6s infinite alternate;
    }

    body::after {
      background: #6c63ff;
      bottom: -100px;
      right: -100px;
      animation: float2 6s infinite alternate;
    }

    @keyframes float1 {
      from { transform: translateY(0px); }
      to { transform: translateY(40px); }
    }

    @keyframes float2 {
      from { transform: translateY(0px); }
      to { transform: translateY(-40px); }
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 350px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    .input-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }

    .input-box input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      transition: 0.3s;
    }

    .input-box input:focus {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 10px #00ffcc;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00ffcc, #6c63ff);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ffcc;
    }

    #msg {
      text-align: center;
      color: #ff4d4d;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>ADMIN LOGIN</h2>

  <div class="input-box">
    <i class="fa-solid fa-envelope"></i>
    <input id="email" placeholder="Email">
  </div>

  <div class="input-box">
    <i class="fa-solid fa-lock"></i>
    <input id="password" type="password" placeholder="Password">
  </div>

  <button onclick="login()">LOGIN</button>

  <p id="msg"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_MrqA2JVetfU-wSqEhy1ATShc_8pDFm0",
  authDomain: "login-c18fa.firebaseapp.com",
  projectId: "login-c18fa",
  storageBucket: "login-c18fa.firebasestorage.app",
  messagingSenderId: "982130273863",
  appId: "1:982130273863:web:abe0bd9bb6798aa48c0b62",
  measurementId: "G-YXGWWRQKLX"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      document.getElementById("msg").style.color = "#00ffcc";
      document.getElementById("msg").innerText = "Login successful...";
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    })
    .catch(err => {
      document.getElementById("msg").innerText = err.message;
    });
}
</script>

</body>
</html>
